version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: simplicion-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simplicion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simplicion_dev_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-simplicion_academy}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - simplicion_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-simplicion} -d ${POSTGRES_DB:-simplicion_academy}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: simplicion-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - simplicion_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  simplicion_pgdata:
    name: simplicion_pgdata
  simplicion_redisdata:
    name: simplicion_redisdata

